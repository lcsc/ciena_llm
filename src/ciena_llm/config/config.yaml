prompt:
  drought_extraction: "drought_extraction_en"
  impact_extraction: "impact_extraction_en"
  location_extraction: "location_extraction_en"
  drought_response_parser: "boolean_response_parser_en"
  impact_response_parser: "boolean_response_parser_en"
  location_response_parser: "location_response_parser_en"
impacts:
  - tag: "agriculture"
    text_es: "agricultura"
    text_en: "agriculture"
  - tag: "farming"
    text_es: "ganadería"
    text_en: "farming"
  - tag: "hydrological_resources"
    text_es: "recursos hídricos"
    text_en: "hydrological resources"
  - tag: "energy"
    text_es: "energía"
    text_en: "energy"
output:
  summary:
    - article_filename
    - article_drought
    - article_impacts_aggregated
    - article_locations_aggregated
    - article_date
    - article_url
    - article_headline
  location_article:
    - article_filename
    - article_body
    - location_name
    - location_type
    - location_other