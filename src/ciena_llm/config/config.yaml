pipeline:
  drought:
    enable: False
    exclude: True
    order: 100
  impact:
    enable: False
    order: 200
  location:
    enable: True
    order: 300
llm:
  default:
    name: "llama3.1"
    temperature: 0
    # Max: 131072
    context_length: 32768
    num_predict_tokens: 2048
