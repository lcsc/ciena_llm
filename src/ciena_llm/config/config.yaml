version: 0.4.1

extraction_task: "hail_event" # "event", "impact", "province", "hail_event"

article_fields:
  - headline
  - body
  - date

llm:
  name: "gemma3:4b"
  temperature: 0
  context_length: 32768
  num_predict_tokens: 4096
  structured_output_mode: "prompt" # "prompt" or "tool"
  seed: 42

steps:
  summarization:
    enable: False
    prompt:
      language: en
  extraction:
    enable: True
    prompt:
      language: en
      cot: True
  self_criticism:
    enable: False
    prompt:
      language: en
  response_parsing:
    enable: True
    prompt:
      language: en

    
output:
  summary:
    - article_filename
    - article_extracted_data
    - article_date
    - article_url
    - article_headline
