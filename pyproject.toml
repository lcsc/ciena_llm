[tool.poetry]
name = "ciena_llm"
version = "0.1.0"
description = ""
authors = ["Javier Vela <javier.vela00@gmail.com>"]
readme = "README.md"
packages = [{ include = "ciena_llm", from = "src" }]

[tool.poetry.scripts]
main = "ciena_llm.main:main"

[tool.poetry.dependencies]
python = "^3.12"
python-dotenv = "^1.0.1"
langchain-ollama = "^0.2.0"
seqia = {git = "https://github.com/lcsc/seqia/"}

[tool.poetry.dev-dependencies]
pytest = "^7.4.4"


[tool.poetry.group.dev.dependencies]
scikit-learn = "^1.5.1"
matplotlib = "^3.9.1"
seaborn = "^0.13.2"
pyqt6 = "^6.7.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
