[tool.poetry]
name = "ciena_llm"
version = "0.1.0"
description = ""
authors = ["Javier Vela <javier.vela00@gmail.com>"]
readme = "README.md"
packages = [{ include = "ciena_llm", from = "src" }]

[tool.poetry.scripts]
main = "ciena_llm.main:main"

[tool.poetry.dependencies]
python = "^3.12,<3.13"
python-dotenv = "^1.0.1"
langchain-ollama = "^0.2.0"
seqia = { git = "https://github.com/lcsc/seqia/" }
pyyaml = "^6.0.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"
scikit-learn = "^1.6.0"
matplotlib = "^3.10.0"
seaborn = "^0.13.2"
pyqt6 = "^6.8.0"
pylint = "^3.3.3"
pylint-pydantic = "^0.3.2"
pandas = "^2.2.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
