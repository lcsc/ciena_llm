[tool.poetry]
name = "ciena_llm"
version = "0.2.0"
description = ""
authors = ["Javier Vela <javier.vela00@gmail.com>"]
readme = "README.md"
packages = [{ include = "ciena_llm", from = "src" }]

[tool.poetry.scripts]
main = "ciena_llm.main:main"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
python-dotenv = "^1.0.1"
spacy = "^3.8.4"
langchain-ollama = "^0.2.3"
seqia = { git = "https://github.com/lcsc/seqia/" }
pyyaml = "^6.0.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
scikit-learn = "^1.6.1"
matplotlib = "^3.10.1"
seaborn = "^0.13.2"
pyqt6 = "^6.8.1"
pylint = "^3.3.4"
pandas = "^2.2.3"
pylint-pydantic = "^0.3.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
